<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sill Display – Station suchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0f14;
        --bg-elevated: rgba(17, 24, 39, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.12), transparent),
          radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.08), transparent);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .container {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .header {
        flex-shrink: 0;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: 6px;
        font-weight: 500;
      }

      .search-wrapper {
        flex-shrink: 0;
      }

      #search-input {
        width: 100%;
        padding: 18px 24px;
        font-size: 1.05rem;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg-elevated);
        backdrop-filter: blur(12px);
        color: var(--text);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      #search-input::placeholder {
        color: var(--text-muted);
      }

      #search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .results {
        margin-top: 12px;
        border-radius: 16px;
        background: var(--bg-elevated);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }

      .results:empty {
        display: none;
      }

      .result-item {
        display: block;
        width: 100%;
        padding: 18px 24px;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }

      .result-item:last-child {
        border-bottom: none;
      }

      .result-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .result-item .name {
        font-weight: 600;
      }

      .result-item .type {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .hint {
        flex: 1;
        padding-top: 24px;
      }

      .hint-text {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin: 0;
      }

      .empty,
      .loading {
        padding: 32px 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Sill Display</h1>
        <p class="subtitle">ÖBB Abfahrten</p>
      </header>
      <div class="search-wrapper">
        <input
          type="text"
          id="search-input"
          placeholder="z.B. Innsbruck, Wien Hbf, Graz"
          autocomplete="off"
        />
      </div>
      <div class="hint" id="hint">
        <p class="hint-text">Station suchen – mindestens 2 Zeichen eingeben</p>
      </div>
      <div class="results" id="results"></div>
    </div>

    <script>
      const searchInput = document.getElementById('search-input');
      const resultsEl = document.getElementById('results');
      const hintEl = document.getElementById('hint');

      let debounceTimer = null;
      const DEBOUNCE_MS = 300;

      async function searchStations(q) {
        const trimmed = (q || '').trim();
        if (trimmed.length < 2) {
          resultsEl.innerHTML = '';
          hintEl.style.display = '';
          return;
        }

        hintEl.style.display = 'none';
        resultsEl.innerHTML = '<div class="loading">Suche…</div>';

        try {
          const res = await fetch(`/api/stations/search?q=${encodeURIComponent(trimmed)}`);
          const data = await res.json();
          const stations = data.stations || [];

          if (stations.length === 0) {
            resultsEl.innerHTML = '<div class="empty">Keine Stationen gefunden.</div>';
            return;
          }

          resultsEl.innerHTML = stations
            .map(
              (s) => `
          <button type="button" class="result-item" data-eva-id="${s.evaId}" data-name="${(s.name || '').replace(/"/g, '&quot;')}">
            <span class="name">${escapeHtml(s.name)}</span>
            ${s.type ? `<span class="type">${escapeHtml(s.type)}</span>` : ''}
          </button>
        `
            )
            .join('');

          resultsEl.querySelectorAll('.result-item').forEach((btn) => {
            btn.addEventListener('click', () => {
              const evaId = btn.dataset.evaId;
              if (evaId) {
                window.location.href = `/station/${evaId}`;
              }
            });
          });
        } catch (err) {
          resultsEl.innerHTML = '<div class="empty">Fehler bei der Suche.</div>';
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => searchStations(searchInput.value), DEBOUNCE_MS);
      });

      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim().length >= 2) {
          searchStations(searchInput.value);
        }
      });
    </script>
  </body>
</html>

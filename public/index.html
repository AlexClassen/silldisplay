<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Sill Display – Station suchen</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #020617;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 480px;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 600;
        text-align: center;
        margin: 0 0 32px;
      }

      .search-wrapper {
        position: relative;
        margin-bottom: 8px;
      }

      #search-input {
        width: 100%;
        padding: 16px 20px;
        font-size: 1.1rem;
        border: 2px solid #1f2937;
        border-radius: 12px;
        background: #030712;
        color: #e5e7eb;
        outline: none;
        transition: border-color 0.2s;
      }

      #search-input::placeholder {
        color: #6b7280;
      }

      #search-input:focus {
        border-color: #3b82f6;
      }

      .results {
        margin-top: 12px;
        border-radius: 12px;
        background: #030712;
        border: 1px solid #111827;
        overflow: hidden;
        max-height: 320px;
        overflow-y: auto;
      }

      .result-item {
        display: block;
        width: 100%;
        padding: 14px 20px;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid #111827;
        color: #e5e7eb;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.15s;
      }

      .result-item:last-child {
        border-bottom: none;
      }

      .result-item:hover {
        background: #0f172a;
      }

      .result-item .name {
        font-weight: 500;
      }

      .result-item .type {
        font-size: 0.85rem;
        opacity: 0.7;
        margin-top: 2px;
      }

      .empty {
        padding: 24px;
        text-align: center;
        opacity: 0.7;
        font-size: 0.95rem;
      }

      .loading {
        padding: 24px;
        text-align: center;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sill Display</h1>
      <p class="empty" id="hint">Station suchen – mindestens 2 Zeichen eingeben</p>
      <div class="search-wrapper">
        <input
          type="text"
          id="search-input"
          placeholder="z.B. Innsbruck, Wien Hbf, Graz"
          autocomplete="off"
        />
      </div>
      <div class="results" id="results"></div>
    </div>

    <script>
      const searchInput = document.getElementById('search-input');
      const resultsEl = document.getElementById('results');
      const hintEl = document.getElementById('hint');

      let debounceTimer = null;
      const DEBOUNCE_MS = 300;

      async function searchStations(q) {
        const trimmed = (q || '').trim();
        if (trimmed.length < 2) {
          resultsEl.innerHTML = '';
          hintEl.style.display = 'block';
          hintEl.textContent = 'Station suchen – mindestens 2 Zeichen eingeben';
          return;
        }

        hintEl.style.display = 'none';
        resultsEl.innerHTML = '<div class="loading">Suche…</div>';

        try {
          const res = await fetch(`/api/stations/search?q=${encodeURIComponent(trimmed)}`);
          const data = await res.json();
          const stations = data.stations || [];

          if (stations.length === 0) {
            resultsEl.innerHTML = '<div class="empty">Keine Stationen gefunden.</div>';
            return;
          }

          resultsEl.innerHTML = stations
            .map(
              (s) => `
          <button type="button" class="result-item" data-eva-id="${s.evaId}" data-name="${(s.name || '').replace(/"/g, '&quot;')}">
            <span class="name">${escapeHtml(s.name)}</span>
            ${s.type ? `<span class="type">${escapeHtml(s.type)}</span>` : ''}
          </button>
        `
            )
            .join('');

          resultsEl.querySelectorAll('.result-item').forEach((btn) => {
            btn.addEventListener('click', () => {
              const evaId = btn.dataset.evaId;
              if (evaId) {
                window.location.href = `/station/${evaId}`;
              }
            });
          });
        } catch (err) {
          resultsEl.innerHTML = '<div class="empty">Fehler bei der Suche.</div>';
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => searchStations(searchInput.value), DEBOUNCE_MS);
      });

      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim().length >= 2) {
          searchStations(searchInput.value);
        }
      });
    </script>
  </body>
</html>

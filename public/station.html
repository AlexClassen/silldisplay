<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sill Display – Abfahrten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0f14;
        --bg-elevated: rgba(17, 24, 39, 0.6);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --on-time: #22c55e;
        --soon: #4ade80;
        --delayed: #f87171;
        --past: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        background-image: radial-gradient(
          ellipse 80% 40% at 50% -10%,
          rgba(56, 189, 248, 0.08),
          transparent
        );
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elevated);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 10;
        gap: 16px;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      #station-name {
        display: block;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      #updated {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-align: right;
      }

      #current-time {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.25rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }

      main#scroll-container {
        flex: 1;
        padding: 24px 28px;
        overflow: auto;
        position: relative;
        z-index: 5;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      main#scroll-container::-webkit-scrollbar {
        display: none;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        padding: 20px 24px;
        border-radius: 16px;
        background: var(--bg-elevated);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        display: grid;
        grid-template-columns: 140px 1fr 100px;
        column-gap: 20px;
        align-items: center;
        min-height: 88px;
        transition: border-color 0.2s;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.12);
      }

      .times {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }

      .time-main {
        font-size: 2rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .time-planned {
        color: var(--text);
      }
      .time-rt {
        color: var(--delayed);
        font-size: 1.25rem;
      }

      .info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }

      .line-dest {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .meta {
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .eta {
        justify-self: flex-end;
        font-size: 0.95rem;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
      }

      .eta-soon {
        color: var(--soon);
        background: rgba(34, 197, 94, 0.12);
      }

      .eta-now {
        color: #fbbf24;
        background: rgba(251, 191, 36, 0.12);
      }

      .eta-past {
        color: var(--past);
        background: rgba(148, 163, 184, 0.08);
      }

      .error {
        color: var(--delayed);
        font-size: 1.1rem;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Abfahrten</h1>
        <span id="station-name">Lade Station…</span>
      </div>
      <div id="current-time">--:--:--</div>
      <div id="updated">Lade Daten…</div>
    </header>

    <main id="scroll-container">
      <div id="cards" class="cards"></div>
    </main>

    <script>
      const FETCH_INTERVAL_MS = 60_000;
      const ETA_UPDATE_MS = 1_000;

      let currentJourneys = [];

      function getEvaIdFromPath() {
        const match = window.location.pathname.match(/^\/station\/(\d+)/);
        return match ? match[1] : null;
      }

      function updateClock() {
        const clockEl = document.getElementById('current-time');
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString('de-AT', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      }
      updateClock();
      setInterval(updateClock, 1000);

      function parseTimeToDate(dateStr, timeStr) {
        if (!timeStr) return null;
        const [h, m] = timeStr.split(':').map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;

        const now = new Date();
        let d;

        if (dateStr) {
          const parts = String(dateStr)
            .trim()
            .split(/[.\/\-]/);
          if (parts.length >= 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            if (!Number.isNaN(day) && !Number.isNaN(month) && !Number.isNaN(year)) {
              d = new Date(year, month, day);
            }
          }
          if (!d || Number.isNaN(d.getTime())) {
            d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          }
        } else {
          d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        d.setHours(h, m, 0, 0);

        if (d.getTime() < now.getTime() && h < 6) {
          d.setDate(d.getDate() + 1);
        }
        return d;
      }

      function formatEtaMinutes(diffMin) {
        if (diffMin >= 60) {
          const h = Math.floor(diffMin / 60);
          const m = diffMin % 60;
          if (m === 0) return h === 1 ? 'in 1 Stunde' : `in ${h} Stunden`;
          return h === 1 ? `in 1 Stunde ${m} Min` : `in ${h} Stunden ${m} Min`;
        }
        if (diffMin === 1) return 'in 1 Min';
        return `in ${diffMin} Min`;
      }

      function formatEta(journey) {
        const targetTime =
          journey.status === 'delayed' && journey.realtimeTime
            ? journey.realtimeTime
            : journey.departure;

        const dt = parseTimeToDate(journey.date, targetTime);
        if (!dt) return { text: '–', className: '' };

        const now = new Date();
        const diffMs = dt.getTime() - now.getTime();
        const diffMin = Math.round(diffMs / 60000);

        if (diffMin <= -1) {
          return { text: 'abgefahren', className: 'eta-past' };
        } else if (diffMin === 0) {
          return { text: 'jetzt', className: 'eta-now' };
        } else if (diffMin <= 5) {
          return { text: formatEtaMinutes(diffMin), className: 'eta-soon' };
        } else {
          return { text: formatEtaMinutes(diffMin), className: '' };
        }
      }

      function renderCard(journey) {
        const card = document.createElement('div');
        card.className = 'card';

        const times = document.createElement('div');
        times.className = 'times';

        const planned = document.createElement('div');
        planned.className = 'time-main time-planned';
        planned.textContent = journey.departure || '--:--';
        times.appendChild(planned);

        if (
          journey.status === 'delayed' &&
          journey.realtimeTime &&
          journey.realtimeTime !== journey.departure
        ) {
          const rt = document.createElement('div');
          rt.className = 'time-main time-rt';
          rt.textContent = journey.realtimeTime;
          times.appendChild(rt);
        }

        const info = document.createElement('div');
        info.className = 'info';

        const lineDest = document.createElement('div');
        lineDest.className = 'line-dest';
        const destText = (journey.to || '').replace(/^Innsbruck\s*/i, '');
        lineDest.textContent = `${journey.tram || ''}: ${destText || '–'}`;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `ab ${journey.from || ''} · ${journey.date || ''}`;

        info.appendChild(lineDest);
        info.appendChild(meta);

        const etaInfo = formatEta(journey);
        const etaEl = document.createElement('div');
        etaEl.className = 'eta ' + etaInfo.className;
        etaEl.textContent = etaInfo.text;

        card.appendChild(times);
        card.appendChild(info);
        card.appendChild(etaEl);

        return { card, etaEl };
      }

      function updateEtaDisplay() {
        if (currentJourneys.length === 0) return;

        const cardsEl = document.getElementById('cards');
        const etaEls = cardsEl.querySelectorAll('.card .eta');
        if (etaEls.length !== currentJourneys.length) return;

        currentJourneys.forEach((journey, i) => {
          const etaInfo = formatEta(journey);
          const etaEl = etaEls[i];
          etaEl.textContent = etaInfo.text;
          etaEl.className = 'eta ' + etaInfo.className;
        });
      }

      async function loadJourneysForStation(evaId) {
        const updatedEl = document.getElementById('updated');
        const cardsEl = document.getElementById('cards');
        const stationNameEl = document.getElementById('station-name');

        try {
          const res = await fetch(`/api/journeys?evaId=${encodeURIComponent(evaId)}`);
          const data = await res.json();

          cardsEl.innerHTML = '';
          currentJourneys = [];

          if (!res.ok) {
            cardsEl.innerHTML = `<div class="error">${data.message || data.error || 'Fehler'}</div>`;
            return;
          }

          if (data.stationName) {
            stationNameEl.textContent = data.stationName;
          }

          const journeys = data.journeys || [];
          currentJourneys = journeys;

          journeys.forEach((j) => {
            const { card } = renderCard(j);
            cardsEl.appendChild(card);
          });

          updatedEl.textContent =
            'Zuletzt aktualisiert: ' +
            new Date(data.updatedAt || Date.now()).toLocaleTimeString('de-AT', {
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
            });
        } catch (err) {
          cardsEl.innerHTML = '<div class="error">Fehler beim Laden.</div>';
          currentJourneys = [];
        }
      }

      function init() {
        const evaId = getEvaIdFromPath();
        if (!evaId) {
          window.location.href = '/';
          return;
        }

        loadJourneysForStation(evaId);
        setInterval(() => loadJourneysForStation(evaId), FETCH_INTERVAL_MS);
        setInterval(updateEtaDisplay, ETA_UPDATE_MS);
      }

      init();
    </script>
  </body>
</html>
